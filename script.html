<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confession Page</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
height:100vh;display:flex;justify-content:center;align-items:center;
background:#fff7f0;
background-image:radial-gradient(#ff9db5 2px, transparent 2px);
background-size:60px 60px;
overflow:hidden;
}
.page{width:90%;max-width:420px;background:#fff;padding:25px;border-radius:20px;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.15)}
.hidden{display:none}
h2{color:#ff4d6d;margin-bottom:15px}
input,textarea{
width:100%;padding:12px;border:2px solid #ff4d6d;border-radius:15px;
margin-top:10px
}
button{
width:100%;padding:12px;margin-top:12px;border:none;border-radius:12px;
background:#ff4d6d;color:#fff;cursor:pointer
}
#yesBtn{background:#28a745}
#noBtn{background:#dc3545;position:absolute;width:120px}
#question{position:relative;height:220px}
#typed{white-space:pre-wrap;min-height:200px;line-height:1.6}
.heart{position:fixed;animation:float 5s linear forwards}
@keyframes float{from{transform:translateY(0);opacity:1}to{transform:translateY(-100vh);opacity:0}}
.loader{width:50px;height:50px;border:5px solid #ffd1dc;border-top:5px solid #ff4d6d;border-radius:50%;animation:spin 1s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="page" id="page1">
<h2>Please Enter Your Name 😁</h2>
<input id="name" placeholder="Your Name">
<button onclick="startConfession()">Submit</button>
</div>

<div class="page hidden" id="loading">
<div class="loader"></div>
<h2 style="margin-top:15px">Preparing your message...</h2>
</div>

<div class="page hidden" id="page2">
<h2>💌 Message For You</h2>
<p id="typed"></p>
<button onclick="nextPage()">Continue</button>
</div>

<div class="page hidden" id="page3">
<h2>CHANCE??</h2>
<div id="question">
<button id="yesBtn" onclick="yesAnswer()">YES</button>
<button id="noBtn">NO</button>
</div>
</div>

<div class="page hidden" id="pageReply">
<h2>Reply Message 💬</h2>
<textarea id="reply" rows="5" placeholder="Write your reply here..."></textarea>
<button onclick="submitReply()">Send Reply</button>
</div>

<div class="page hidden" id="page4">
<h2>Thank You ❤️</h2>
<p>Your reply has been sent.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBpxlYUntT6flNCjCXUd4fYa6hmSmX2kpA",
    authDomain: "memecha-c10e2.firebaseapp.com",
    databaseURL: "https://memecha-c10e2-default-rtdb.firebaseio.com",
    projectId: "memecha-c10e2",
    storageBucket: "memecha-c10e2.firebasestorage.app",
    messagingSenderId: "682910602156",
    appId: "1:682910602156:web:9b7fd6beda2aa3e36ae009"
  };

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let confessionRef=null;
let userName="";

const noBtn=document.getElementById("noBtn");

function moveButton(){
 const x=Math.random()*220;
 const y=Math.random()*140;
 noBtn.style.left=x+"px";
 noBtn.style.top=y+"px";

 if(confessionRef){
   confessionRef.child("attemptedNoCount").transaction(v=>(v||0)+1);
 }
}

noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("click",moveButton);

function startConfession(){
 userName=document.getElementById("name").value.trim();
 if(!userName){alert("Enter your name");return;}

 confessionRef=db.ref("confessions").push();

 confessionRef.set({
   name:userName,
   finalAnswer:"Pending",
   reply:"",
   attemptedNoCount:0,
   timestamp:new Date().toISOString()
 });

 page1.classList.add("hidden");
 loading.classList.remove("hidden");

 setTimeout(()=>{
   loading.classList.add("hidden");
   page2.classList.remove("hidden");
   typeMessage();
 },2000);
}

function typeMessage(){
 const text=`Hi ${userName},

I have something important to tell you...

Every time I see you, my day becomes brighter.

You make me smile without trying.

I like you ❤️`;

 let i=0;
 const box=document.getElementById("typed");

 function t(){
   if(i<text.length){
     box.textContent+=text.charAt(i);
     i++;
     setTimeout(t,35);
   }
 }
 t();
}

function nextPage(){
 page2.classList.add("hidden");
 page3.classList.remove("hidden");
}

function yesAnswer(){
 if(confessionRef){
   confessionRef.update({
     finalAnswer:"YES"
   });
 }
 page3.classList.add("hidden");
 pageReply.classList.remove("hidden");
}

function submitReply(){
 const reply=document.getElementById("reply").value.trim();

 if(!reply){
   alert("Please write a reply.");
   return;
 }

 confessionRef.update({
   reply:reply,
   submittedAt:new Date().toISOString()
 });

 pageReply.classList.add("hidden");
 page4.classList.remove("hidden");

 setInterval(createHeart,250);
}

function createHeart(){
 const h=document.createElement("div");
 h.className="heart";
 h.innerHTML="❤️";
 h.style.left=Math.random()*100+"vw";
 h.style.bottom="0";
 h.style.fontSize=(20+Math.random()*20)+"px";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),5000);
}
</script>
</body>
</html>
